<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Gemini Quota Bridge</title>
    <style>
        body {
            width: 300px;
            margin: 0;
            padding: 14px;
            background-color: #1A1C23;
            color: #E8EAED;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .title {
            font-size: 13px;
            font-weight: 700;
            color: #8AB4F8;
        }
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #81C995;
            display: inline-block;
            margin-right: 4px;
        }
        .status-dot.offline {
            background-color: #EA4335;
        }
        .card {
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px;
            padding: 10px;
            margin-bottom: 12px;
        }
        .row {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            margin-bottom: 6px;
        }
        .row:last-child {
            margin-bottom: 0;
        }
        .label {
            color: #9AA0A6;
        }
        .val {
            font-weight: 600;
            color: #FFFFFF;
        }
        button.primary {
            width: 100%;
            background: #1A73E8;
            color: white;
            border: none;
            border-radius: 6px;
            padding: 8px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            margin-bottom: 8px;
        }
        button.primary:hover {
            background: #185ABC;
        }
        .manual-box {
            display: flex;
            gap: 6px;
            align-items: center;
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px dashed rgba(255,255,255,0.12);
        }
        .manual-box input {
            width: 60px;
            background: #242731;
            border: 1px solid #3C4043;
            color: white;
            padding: 5px;
            border-radius: 4px;
            text-align: center;
            font-weight: bold;
        }
        .manual-box button {
            flex: 1;
            background: rgba(255,255,255,0.1);
            color: white;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 4px;
            padding: 6px;
            cursor: pointer;
            font-size: 11px;
            font-weight: 600;
        }
        .manual-box button:hover {
            background: rgba(255,255,255,0.2);
        }
        .msg {
            font-size: 11px;
            text-align: center;
            color: #81C995;
            margin-top: 4px;
            min-height: 14px;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="title">✨ Gemini Quota Bridge</div>
        <div style="font-size: 11px;">
            <span id="dot" class="status-dot"></span>
            <span id="status-text">Bağlanıyor...</span>
        </div>
    </div>

    <div class="card">
        <div class="row">
            <span class="label">Masaüstü Çubuk:</span>
            <span id="quota-val" class="val">-- %</span>
        </div>
        <div class="row">
            <span class="label">Sıfırlanma Sayacı:</span>
            <span id="timer-val" class="val">--:--:--</span>
        </div>
        <div class="row">
            <span class="label">Plan:</span>
            <span id="plan-val" class="val">Google AI Pro</span>
        </div>
    </div>

    <button id="sync-btn" class="primary">🔄 Şimdi Tara ve Eşitle</button>

    <div class="manual-box">
        <span style="font-size: 11px; color: #9AA0A6;">Hızlı Ayar:</span>
        <input type="number" id="quick-pct" min="0" max="100" placeholder="%">
        <button id="set-btn">Masaüstüne Yaz</button>
    </div>
    <div id="msg" class="msg"></div>

    <script src="popup.js"></script>
</body>
</html>
